[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrun"
version = "0.1.0"
description = "Biological Reflex Architecture for Autonomous Navigation based on Drosophila Connectome"
authors = [{ name = "FlyRun Architects" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "websockets>=12.0",
    "neuprint-python>=0.4.26",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["circuits*", "engine*", "sim*", "telemetry*", "data*"]
